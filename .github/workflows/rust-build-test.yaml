name: Test - Rust

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: RouteE-Compass Rust Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        # Toolchain version and components come from rust-toolchain.toml so that
        # CI stays in lockstep with the pixi environment instead of floating to
        # whatever the latest stable happens to be.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
          cargo install cargo-sort

      - name: Build
        working-directory: ./rust
        run: |
          cargo build --verbose

      - name: Run tests
        working-directory: ./rust
        run: cargo test --workspace

      - name: Run formatting
        working-directory: ./rust
        run: cargo fmt -- --check

      - name: Run lint checker
        working-directory: ./rust
        run: cargo clippy --all --all-targets --all-features -- -D warnings

      - name: Run cargo sort --check
        working-directory: ./rust
        run: cargo sort --check --workspace