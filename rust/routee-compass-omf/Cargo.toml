[package]
name = "routee-compass-omf"
version = "0.3.1"
edition = "2021"
license = "BSD-3-Clause"
include = ["Cargo.toml", "README.md", "src/**/*.rs", "src/util/omf-defaults.toml"]
readme = "README.md"
repository = "https://github.com/NatLabRockies/routee-compass"
# documentation = "https://docs.rs/bambam-omf"
description = "OvertureMaps Foundation support for RouteE Compass"
categories = ["command-line-utilities", "science", "science::geo"]

