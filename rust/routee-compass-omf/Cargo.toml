geo = { workspace = true }
geozero = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
kdam = { workspace = true }
log = { workspace = true }
object_store = { workspace = true }
opening-hours-syntax = { workspace = true }
ordered-float = { workspace = true }
parquet = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
routee-compass = { version = "0.19.3", path = "../routee-compass" }
routee-compass-core = { version = "0.19.3", path = "../routee-compass-core" }
# routee-compass-powertrain = { workspace = true }
serde = { workspace = true }
serde_arrow = { workspace = true }
